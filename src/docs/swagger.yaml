openapi: 3.0.0
info:
    title: Computer API
    version: 1.0.0
    description: |
        REST API for event processing and metric computation in Computer.
servers:
    - url: /

tags:
    - name: Health
      description: Server health check
    - name: Events
      description: Event catalog, processing and validation
    - name: Metrics
      description: Metric computation

paths:
    # ──────────────────────────────────────────────
    # Health
    # ──────────────────────────────────────────────
    /health:
        get:
            tags:
                - Health
            summary: Health check
            operationId: healthCheck
            responses:
                '200':
                    description: Service is up
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'

    # ──────────────────────────────────────────────
    # Events
    # ──────────────────────────────────────────────
    /api/v1/events:
        get:
            tags:
                - Events
            summary: Get all events
            operationId: getEvents
            description: Returns all available event definitions.
            responses:
                '200':
                    description: Events retrieved successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Event'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/events/{eventId}:
        parameters:
            - $ref: '#/components/parameters/eventId'
        get:
            tags:
                - Events
            summary: Get event by id
            operationId: getEventById
            description: Returns one event definition by id.
            responses:
                '200':
                    description: Event retrieved successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Event'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/events/{eventId}/process:
        parameters:
            - $ref: '#/components/parameters/eventId'
            - $ref: '#/components/parameters/expand'
        post:
            tags:
                - Events
            summary: Process an event
            operationId: processEvent
            description: Processes an event for a date and window using the provided fetcher and process configs.
            requestBody:
                $ref: '#/components/requestBodies/ProcessEventBody'
            responses:
                '200':
                    description: Event processed successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              oneOf:
                                                  - $ref: '#/components/schemas/ProcessedEventSummary'
                                                  - $ref: '#/components/schemas/ProcessedEventDetailed'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/events/{eventId}/validate:
        parameters:
            - $ref: '#/components/parameters/eventId'
        post:
            tags:
                - Events
            summary: Validate event configuration
            operationId: validateEvent
            description: Validates optional fetcher configs and process config for the selected event.
            requestBody:
                $ref: '#/components/requestBodies/ValidateEventBody'
            responses:
                '200':
                    description: Validation executed.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/EventValidationResult'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Metrics
    # ──────────────────────────────────────────────
    /api/v1/metric/compute:
        post:
            tags:
                - Metrics
            summary: Compute metric
            operationId: computeMetric
            description: Processes an event and applies aggregation to compute a metric value.
            requestBody:
                $ref: '#/components/requestBodies/ComputeMetricBody'
            responses:
                '200':
                    description: Metric computed successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/ComputedMetric'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

components:
    # ── Parameters ────────────────────────────
    parameters:
        eventId:
            name: eventId
            in: path
            required: true
            description: Event identifier.
            schema:
                type: string
                example: EV_GITHUB_COMMITS
        expand:
            name: expand
            in: query
            required: false
            description: If true, includes raw fetch data in the response.
            schema:
                type: boolean
                default: false
                example: false

    # ── Request Bodies ────────────────────────
    requestBodies:
        ProcessEventBody:
            description: Request body for event processing
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ProcessEventRequest'
        ValidateEventBody:
            description: Request body for event validation (all fields optional)
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidateEventRequest'
        ComputeMetricBody:
            description: Request body for metric computation
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ComputeMetricRequest'

    # ── Responses ─────────────────────────────
    responses:
        ValidationError:
            description: Validation error.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Validation failed
                        httpStatus: 400
                        appCode: VALIDATION_ERROR
                        data: null
                        error:
                            message: Validation failed
                            details:
                                - msg: date is required
                                  path: date
        NotFound:
            description: Requested resource not found.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Event EV_UNKNOWN not found
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: Event EV_UNKNOWN not found
                            details: null
        InternalError:
            description: Internal server error.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Unexpected error
                        httpStatus: 500
                        appCode: UNKNOWN_ERROR
                        data: null
                        error:
                            message: Unexpected error
                            details: null

    # ── Schemas ───────────────────────────────
    schemas:
        HealthResponse:
            type: object
            properties:
                status:
                    type: string
                    example: ok
                message:
                    type: string
                    example: Health check passed
            required:
                - status
                - message

        SuccessResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                data: {}
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        ErrorResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: Validation failed
                httpStatus:
                    type: integer
                    example: 400
                appCode:
                    type: string
                    example: VALIDATION_ERROR
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                            example: Validation failed
                        details:
                            nullable: true
                    required:
                        - message
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        Event:
            type: object
            description: Event definition currently available in the service.
            properties:
                id:
                    type: string
                    example: EV_GITHUB_COMMITS
                moreInfo:
                    type: object
                    properties:
                        title:
                            type: string
                            example: Number of Commits by Team
                        description:
                            type: string
                            example: Total number of commits made to a specific repository by the entire team.
                        example:
                            type: string
                            example: If the team made 50 commits in the last month, the metric value would be 50.
                    required:
                        - title
                        - description
                        - example
                fetcherIds:
                    type: array
                    items:
                        type: string
                    example:
                        - FT_REST_GITHUB_COMMITS
                processConfigSchema:
                    type: object
                    description: Serialized zod schema used to validate processConfig.
                    additionalProperties: true
                processScript:
                    type: string
                    nullable: true
                    description: Stringified process function for documentation/debugging.
            required:
                - id
                - moreInfo
                - fetcherIds
                - processConfigSchema

        FetcherConfig:
            type: object
            properties:
                fetcherId:
                    type: string
                    example: FT_REST_GITHUB_COMMITS
                fetcherConfig:
                    type: object
                    additionalProperties: true
                    example:
                        owner: governify
                        repository: governify-next
            required:
                - fetcherId
                - fetcherConfig

        FetchSummary:
            type: object
            properties:
                fetcherId:
                    type: string
                fetcherConfig:
                    type: object
                    additionalProperties: true
                fetchResultId:
                    type: string
            required:
                - fetcherId
                - fetcherConfig
                - fetchResultId

        FetchDetail:
            allOf:
                - $ref: '#/components/schemas/FetchSummary'
                - type: object
                  properties:
                      data:
                          description: Raw data returned by collector for this fetcher.
                  required:
                      - data

        Window:
            type: object
            properties:
                anchorDate:
                    type: string
                    format: date-time
                    example: '2026-04-22T10:00:00.000Z'
                period:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        properties:
                            unit:
                                type: string
                                enum: [millisecond, second, minute, hour, day, week]
                                example: day
                            value:
                                type: integer
                                minimum: 1
                                example: 30
                        required:
                            - unit
                            - value
            required:
                - anchorDate
                - period

        ProcessEventRequest:
            type: object
            properties:
                date:
                    type: string
                    format: date-time
                    example: '2026-04-22T10:00:00.000Z'
                window:
                    $ref: '#/components/schemas/Window'
                fetcherConfigs:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/FetcherConfig'
                processConfig:
                    type: object
                    additionalProperties: true
                    example:
                        owner: governify
                        repository: governify-next
            required:
                - date
                - window
                - fetcherConfigs
                - processConfig

        ValidateEventRequest:
            type: object
            description: At least one of fetcherConfigs or processConfig is recommended.
            properties:
                fetcherConfigs:
                    type: array
                    items:
                        $ref: '#/components/schemas/FetcherConfig'
                processConfig:
                    type: object
                    additionalProperties: true
                    example:
                        owner: governify
                        repository: governify-next

        ProcessedEventSummary:
            type: object
            properties:
                events:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                eventId:
                    type: string
                    example: EV_GITHUB_COMMITS
                date:
                    type: string
                    format: date-time
                    example: '2026-04-22T10:00:00.000Z'
                window:
                    $ref: '#/components/schemas/Window'
                fetchs:
                    type: array
                    items:
                        $ref: '#/components/schemas/FetchSummary'
                processConfig:
                    type: object
                    additionalProperties: true
            required:
                - events
                - eventId
                - date
                - window
                - fetchs
                - processConfig

        ProcessedEventDetailed:
            type: object
            properties:
                events:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                eventId:
                    type: string
                    example: EV_GITHUB_COMMITS
                date:
                    type: string
                    format: date-time
                    example: '2026-04-22T10:00:00.000Z'
                window:
                    $ref: '#/components/schemas/Window'
                fetchs:
                    type: array
                    items:
                        $ref: '#/components/schemas/FetchDetail'
                processConfig:
                    type: object
                    additionalProperties: true
            required:
                - events
                - eventId
                - date
                - window
                - fetchs
                - processConfig

        EventValidationIssue:
            type: object
            description: Validation issue from fetcherConfig or processConfig.
            properties:
                source:
                    type: string
                    enum: [fetcherConfig, processConfig]
                    example: processConfig
                fetcherId:
                    type: string
                    nullable: true
                    example: FT_REST_GITHUB_COMMITS
                code:
                    type: string
                    example: invalid_type
                message:
                    type: string
                    example: Required
                path:
                    type: array
                    items:
                        oneOf:
                            - type: string
                            - type: integer
            required:
                - source

        EventValidationResult:
            oneOf:
                - type: object
                  properties:
                      valid:
                          type: boolean
                          enum: [true]
                          example: true
                  required:
                      - valid
                - type: object
                  properties:
                      valid:
                          type: boolean
                          enum: [false]
                          example: false
                      error:
                          type: string
                          example: Invalid processConfig
                      issues:
                          type: array
                          items:
                              $ref: '#/components/schemas/EventValidationIssue'
                  required:
                      - valid
                      - error

        AggregationConfig:
            type: object
            properties:
                type:
                    type: string
                    enum: [count]
                    example: count
            required:
                - type
            additionalProperties: true

        ComputeMetricRequest:
            type: object
            properties:
                event:
                    type: object
                    properties:
                        eventId:
                            type: string
                            example: EV_GITHUB_COMMITS
                        date:
                            type: string
                            format: date-time
                            example: '2026-04-22T10:00:00.000Z'
                        window:
                            $ref: '#/components/schemas/Window'
                        fetcherConfigs:
                            type: array
                            minItems: 1
                            items:
                                $ref: '#/components/schemas/FetcherConfig'
                        processConfig:
                            type: object
                            additionalProperties: true
                            example:
                                owner: governify
                                repository: governify-next
                    required:
                        - eventId
                        - date
                        - window
                        - fetcherConfigs
                        - processConfig
                aggregation:
                    $ref: '#/components/schemas/AggregationConfig'
            required:
                - event
                - aggregation

        ComputedMetric:
            type: object
            properties:
                value:
                    type: number
                    nullable: true
                    example: 42
                evidences:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                metricConfig:
                    type: object
                    properties:
                        event:
                            type: object
                            properties:
                                eventId:
                                    type: string
                                    example: EV_GITHUB_COMMITS
                                fetcherConfigs:
                                    type: array
                                    items:
                                        allOf:
                                            - $ref: '#/components/schemas/FetcherConfig'
                                            - type: object
                                              properties:
                                                  fetchResultId:
                                                      type: string
                                                      example: 67c9ff7b2ddf1b3940f9f321
                                              required:
                                                  - fetchResultId
                                processConfig:
                                    type: object
                                    additionalProperties: true
                            required:
                                - eventId
                                - fetcherConfigs
                                - processConfig
                        aggregation:
                            $ref: '#/components/schemas/AggregationConfig'
                    required:
                        - event
                        - aggregation
            required:
                - value
                - evidences
                - metricConfig
